<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whisk Diary &middot; search</title>
<meta name="description" content="Search Whisk Diary for people or for matcha houses.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%B5%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Quicksand:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="search">

<main class="wrap page">

  <p class="eyebrow">Look someone up</p>
  <h1>Who or where are you after?</h1>
  <p class="hand">names, nicknames, neighbourhoods &mdash; all of it works</p>

  <!-- The search itself. The two chips below narrow it to one kind of
       result; with both on, the page shows people and houses together. -->
  <section class="search-hero" style="margin-top:1.4rem">
    <form class="search-hero__row" id="searchForm" role="search">
      <label class="sr-only" for="q">Search Whisk Diary</label>
      <input id="q" name="q" type="search" autocomplete="off"
             placeholder="maya, matcha osaka, cha yen, neighbors…">
      <button class="btn" type="submit">Search</button>
    </form>

    <div class="filters">
      <span class="filters__label" id="filterLabel">Show</span>
      <button class="chip chip--blush" type="button" id="chipProfiles"
              aria-pressed="true" aria-describedby="filterLabel">
        <span aria-hidden="true">&#128131;</span> Profiles
      </button>
      <button class="chip" type="button" id="chipCafes"
              aria-pressed="true" aria-describedby="filterLabel">
        <span aria-hidden="true">&#127861;</span> Matcha houses
      </button>
    </div>
  </section>

  <p class="small muted" id="summary" style="margin-top:1rem" aria-live="polite"></p>

  <section id="profilesBlock">
    <div class="section-head">
      <div>
        <p class="eyebrow">People</p>
        <h2 id="profilesHeading">Profiles</h2>
      </div>
    </div>
    <div class="grid" id="profilesResults"></div>
  </section>

  <section id="cafesBlock">
    <div class="section-head">
      <div>
        <p class="eyebrow">Places</p>
        <h2 id="cafesHeading">Matcha houses</h2>
      </div>
    </div>
    <div class="grid" id="cafesResults"></div>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/app.js"></script>
<script src="js/search.js"></script>
</body>
</html>
