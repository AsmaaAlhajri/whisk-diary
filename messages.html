<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whisk Diary &middot; messages</title>
<meta name="description" content="Your private messages on Whisk Diary.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%B5%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Quicksand:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="messages">

<main class="wrap page">

  <p class="eyebrow"><span aria-hidden="true">&#128274;</span> Only you and her</p>
  <h1>Messages</h1>
  <p class="hand">the one private corner of the diary</p>

  <div class="dm" id="dm" style="margin-top:1.4rem">
    <div class="dm__list" id="dmList">
      <div class="skeleton" style="min-height:8rem"></div>
    </div>

    <div class="dm__thread" id="dmThread">
      <div class="dm__head" id="dmHead">
        <span class="muted small">Pick someone on the left to read what you said.</span>
      </div>
      <div class="dm__scroll" id="dmScroll"></div>
      <form class="dm__form" id="dmForm" hidden>
        <label class="sr-only" for="dmText">Your message</label>
        <input id="dmText" type="text" maxlength="2000" autocomplete="off"
               placeholder="Say something nice…">
        <button class="btn btn--small" type="submit">Send</button>
      </form>
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/app.js"></script>
<script src="js/messages.js"></script>
</body>
</html>
