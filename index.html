<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whisk Diary &middot; a community diary for matcha lovers</title>
<meta name="description" content="Whisk Diary is a little community diary of matcha - the matcha houses we love, the cups we cannot stop thinking about, and the girls who write it all down.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%B5%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Quicksand:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home">

<main class="wrap page">

  <!-- The greeting. Logged out it welcomes every matcha lover; logged in
       it is written to her by name. Both are filled by js/home.js. -->
  <section class="hero" id="hero" aria-live="polite">
    <div class="hero__doodles" aria-hidden="true"><span>&#127799;</span><span>&#127861;</span><span>&#127800;</span></div>
    <div class="hero__inner">
      <p class="eyebrow" id="heroEyebrow">Whisk Diary</p>
      <h1 id="heroTitle">Hello, matcha darling.</h1>
      <p class="hand" id="heroHand">the kettle is already on&hellip;</p>
      <p class="hero__lede" id="heroLede"></p>
      <div class="hero__cta" id="heroCta"></div>
    </div>
  </section>

  <!-- Latest reviews across the whole diary -->
  <div class="section-head">
    <div>
      <p class="eyebrow">Fresh ink</p>
      <h2>This week in the diary</h2>
    </div>
    <a class="btn btn--small" href="create.html"><span aria-hidden="true">&#128395;&#65039;</span> Write something</a>
  </div>
  <div id="latest"><div class="skeleton"></div></div>

  <!-- Profiles with the most followers -->
  <div class="section-head">
    <div>
      <p class="eyebrow">Sweethearts</p>
      <h2>Girls worth reading</h2>
    </div>
    <a class="btn btn--ghost btn--small" href="search.html?filter=profiles">See all profiles</a>
  </div>
  <div class="grid" id="people"><div class="skeleton"></div><div class="skeleton"></div></div>

  <!-- Best rated matcha houses -->
  <div class="section-head">
    <div>
      <p class="eyebrow">Loved cups</p>
      <h2>Matcha houses the diary keeps returning to</h2>
    </div>
    <a class="btn btn--ghost btn--small" href="search.html?filter=cafes">See all matcha houses</a>
  </div>
  <div class="grid" id="cafes"><div class="skeleton"></div><div class="skeleton"></div></div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/app.js"></script>
<script src="js/home.js"></script>
</body>
</html>
